<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Recomendaciones en Berlín — Juan Berliner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root{--ink:#001219;--stone:#012A36;--raised:#013747;--line:#003D52;--mist:#7FB5BF;--parchment:#E9D8A6;--brass:#B8860B;--brass-line:rgba(184,134,11,.32);--r:2px;--ease:cubic-bezier(.16,1,.3,1);--list:392px;--panel:408px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column;height:100dvh;background:var(--ink);color:var(--parchment);font:400 15px/1.6 'Inter',system-ui,sans-serif;font-feature-settings:"tnum" 1,"lnum" 1}
    ::selection{background:var(--brass);color:var(--ink)}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
    *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

    /* Nav */
    .m-nav{flex:none;display:flex;align-items:center;gap:1rem;height:64px;padding:0 1.5rem;background:var(--ink);border-bottom:1px solid var(--line);position:relative;z-index:1100}
    .nav-back{display:flex;align-items:center;gap:.4rem;min-height:44px;font-size:.875rem;color:var(--mist);transition:color .2s}
    .nav-back:hover{color:#fff}
    .nav-sep{width:1px;height:20px;background:var(--line)}
    .nav-brand{font:600 1.375rem/1 'Playfair Display',Georgia,serif;letter-spacing:-.01em;color:#fff;transition:color .2s}
    .nav-brand:hover{color:var(--brass)}
    .nav-flex{flex:1}
    .lang-toggle{display:flex;border:1px solid var(--line);border-radius:var(--r)}
    .lang-btn{min-width:44px;min-height:40px;padding:0 .7rem;font-size:.75rem;font-weight:600;letter-spacing:.1em;color:var(--mist);transition:color .2s,background-color .2s}
    .lang-btn:hover{color:#fff}
    .lang-btn.active{background:var(--brass);color:var(--ink)}

    /* Layout */
    #main{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;grid-template-columns:var(--list) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"head map" "filters map" "list map"}
    #m-head{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:1.5rem 1.5rem .25rem;border-right:1px solid var(--line)}
    #m-head h1{white-space:nowrap;font:500 1.5625rem/1.1 'Playfair Display',Georgia,serif;letter-spacing:-.015em;color:#fff}
    #n-count{flex:none;font-size:.8125rem;color:var(--mist)}
    #filters{grid-area:filters;display:flex;flex-wrap:wrap;gap:.25rem .375rem;padding:.875rem 1.5rem 1rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .chip{display:inline-flex;align-items:center;gap:.4rem;min-height:36px;padding:.2rem .6rem;border:1px solid transparent;border-radius:var(--r);font-size:.8125rem;font-weight:500;line-height:1.2;color:var(--mist);white-space:nowrap;transition:color .2s,border-color .2s,background-color .2s}
    .chip svg{width:14px;height:14px;flex:none}
    .chip .cnt{font-size:.75rem;opacity:.75}
    .chip:hover{color:#fff;border-color:var(--line)}
    .chip.active{background:var(--raised);border-color:var(--brass);color:var(--parchment)}
    .chip.active svg{color:var(--brass)}
    #list{grid-area:list;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line)}
    .l-group h2{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.5rem;padding:.8rem 1.5rem .6rem;background:var(--ink);border-bottom:1px solid var(--brass-line);font:600 .75rem/1.3 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--parchment)}
    .l-group h2 svg{width:14px;height:14px;color:var(--brass);flex:none}
    .l-group h2 span:last-child{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mist)}
    .list-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:.875rem;align-items:center;width:100%;padding:.75rem 1.5rem;text-align:left;border-bottom:1px solid rgba(0,61,82,.55);transition:background-color .15s}
    .list-item:hover{background:var(--stone)}
    .list-item.sel{background:var(--raised);box-shadow:inset 2px 0 0 var(--brass)}
    .list-item:focus-visible{outline-offset:-2px}
    .li-thumb{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;overflow:hidden;border-radius:var(--r);background:var(--stone);color:var(--brass)}
    .li-thumb svg{width:22px;height:22px}
    .li-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .li-name{display:block;font:500 1.0625rem/1.25 'Playfair Display',Georgia,serif;color:#fff;overflow-wrap:anywhere}
    .li-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.2rem;font-size:.8125rem;line-height:1.45;color:var(--mist)}

    /* Map */
    #map{grid-area:map;min-height:0;background:var(--ink)}
    .is-raster .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.72) saturate(.5)}
    .leaflet-container{font-family:inherit;background:var(--ink)}
    .leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:var(--r)!important;box-shadow:none!important}
    .leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:34px!important;background:var(--ink)!important;border-color:var(--line)!important;border-radius:0!important;color:var(--parchment)!important;transition:color .2s}
    .leaflet-control-zoom a:hover{color:var(--brass)!important}
    .leaflet-control-attribution{background:rgba(0,18,25,.72)!important;color:var(--mist)!important;font-size:10px}
    .leaflet-control-attribution a{color:var(--parchment)!important}
    .leaflet-marker-icon.pin-wrap{background:none;border:0;outline:0}
    .pin{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);border:1px solid var(--brass);color:var(--parchment);box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .2s var(--ease),background-color .15s,color .15s}
    .pin svg{width:13px;height:13px}
    .pin-wrap:hover .pin,.pin-wrap.is-hot .pin,.pin-wrap:focus-visible .pin{transform:scale(1.25);background:var(--raised);color:#fff}
    .pin-wrap:focus-visible .pin{outline:2px solid var(--parchment);outline-offset:2px}
    .pin-wrap.is-sel .pin{transform:scale(1.5);background:var(--brass);border-color:var(--parchment);color:var(--ink)}
    .leaflet-tooltip.pin-tip{padding:.25rem .55rem;background:var(--ink);border:1px solid var(--brass-line);border-radius:var(--r);box-shadow:0 3px 10px rgba(0,0,0,.4);font:500 .875rem/1.3 'Playfair Display',Georgia,serif;color:#fff}
    .leaflet-tooltip.pin-tip::before{display:none}

    /* Detail panel */
    #panel{position:absolute;top:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:column;width:var(--panel);background:var(--ink);border-left:1px solid var(--brass-line);box-shadow:-12px 0 32px rgba(0,0,0,.35);transform:translateX(102%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
    #panel.open{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
    #panel-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
    #panel-photo{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;background:var(--stone);color:var(--brass);overflow:hidden}
    #panel-photo>svg{width:44px;height:44px}
    #panel-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #panel-close{position:absolute;top:.75rem;right:.75rem;z-index:3;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);color:var(--parchment);transition:color .2s,border-color .2s}
    #panel-close:hover{color:#fff;border-color:var(--brass)}
    #panel-body{padding:1.5rem}
    .p-badge{display:flex;align-items:center;gap:.45rem;font-size:.75rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--parchment)}
    .p-badge svg{width:14px;height:14px;color:var(--brass);flex:none}
    .p-name{margin-top:.5rem;font:500 2rem/1.12 'Playfair Display',Georgia,serif;letter-spacing:-.015em;color:#fff;text-wrap:balance;overflow-wrap:anywhere}
    .p-desc{margin-top:1rem;font-size:1rem;line-height:1.65;color:var(--parchment);text-wrap:pretty}
    .p-row{display:flex;gap:.6rem;margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.875rem;line-height:1.55;color:var(--mist)}
    .p-row svg{width:15px;height:15px;flex:none;margin-top:.2rem;color:var(--brass)}
    .p-gmaps{display:flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;margin-top:1.5rem;padding:.6rem 1rem;border:1px solid var(--brass);border-radius:var(--r);font-size:.9375rem;font-weight:600;color:var(--parchment);transition:background-color .2s,color .2s}
    .p-gmaps:hover{background:var(--brass);color:var(--ink)}
    .p-gmaps svg{transition:transform .25s var(--ease)}
    .p-gmaps:hover svg{transform:translateX(3px)}

    @media (max-width:900px){
      :root{--head:50px;--filters:56px;--map-h:36svh}
      .m-nav{height:56px;padding:0 1rem;gap:.75rem}
      .nav-brand{font-size:1.1875rem}
      #main{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--head) var(--filters) var(--map-h) minmax(0,1fr);grid-template-areas:"head" "filters" "map" "list"}
      #m-head{align-items:center;padding:0 1rem;border-right:0}
      #m-head h1{font-size:1.375rem}
      #filters{flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:.375rem;padding:0 1rem;border-right:0;scrollbar-width:none}
      #filters::-webkit-scrollbar{display:none}
      .chip{min-height:40px;flex:none}
      #list{border-right:0;border-top:1px solid var(--line)}
      .l-group h2,.list-item{padding-inline:1rem}
      #panel{top:calc(var(--head) + var(--filters) + var(--map-h));width:100%;border-left:0;border-top:1px solid var(--brass);box-shadow:0 -10px 28px rgba(0,0,0,.4);transform:translateY(102%)}
      #panel-photo{aspect-ratio:21/9}
      #panel-body{padding:1.1rem 1rem 1.5rem}
      .p-name{font-size:1.625rem}
      #panel-close{top:.5rem;right:.5rem}
    }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<div id="main">

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ── STATE ───────────────────────────────────────────────────────
let lang = 'es';
let currentCategory = null;

let lastTrigger = null;

// ── CATEGORIES (un solo color: se distinguen por el icono) ──────
const GLYPH = {

const label = c => lang === 'es' ? CAT[c].label_es : CAT[c].label_en;
const places_n = n => lang === 'es' ? n + ' lugar' + (n !== 1 ? 'es' : '') : n + ' place' + (n !== 1 ? 's' : '');
const descOf = p => lang === 'es' ? (DESC_ES[p.name] || p.desc) : p.desc;

// ── SPANISH DESCRIPTIONS ─────────────────────────────────────────
const DESC_ES = {
  // FOOD
  "Markthalle Neun": "¡Un mercado gastronómico con todo lo que puedas imaginar! Si no sabés adónde ir, ¡este es el lugar!",

// ── PHOTO URL (source.unsplash.com, free, no key needed) ─────────
function getPhotoUrl(place) {
  if (PHOTO_URLS[place.name]) return PHOTO_URLS[place.name];
  const catKw = {
    'Food':                'food,restaurant',
    'Bars':                'bar,beer,pub',
    'Museums':             'museum,exhibition',
    'Green Areas & Lakes': 'park,lake,nature',
    'Clubs':               'nightclub,music',
    'Cafes/Brunch':        'coffee,cafe,brunch',
    'Feeling Fancy':       'cocktail,fine+dining',
    'Squares & Locations': 'city,plaza,street',
  };
  const name = place.name.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).slice(0, 2).join('+');
  const cat = catKw[place.category] || 'berlin';
  return `https://source.unsplash.com/800x500/?berlin,${cat},${name}`;
}

// ── MAP ──────────────────────────────────────────────────────────
const map = L.map('map', { center:[52.499,13.400], zoom:12, zoomControl:true, attributionControl:true });
map.attributionControl.setPrefix(false);
const ATTR = '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';

// Recolorea el estilo del mapa con la paleta del sitio
function tuneStyle(style) {
  const ink='#001219', stone='#012A36', raised='#013747', line='#003D52', mist='#7FB5BF', parch='#E9D8A6';
  style.layers = style.layers.filter(l => !/oneway|aeroway|highway_name_motorway|boundary_state/.test(l.id));
  style.layers.forEach(l => {
    const p = l.paint = l.paint || {};
    if (l.type === 'background') p['background-color'] = ink;
    else if (l.id === 'water') { p['fill-color'] = raised; delete p['fill-pattern']; }
    else if (l.id === 'waterway') p['line-color'] = raised;
    else if (/landuse_park|landcover_wood/.test(l.id)) { p['fill-color'] = '#01212B'; p['fill-opacity'] = 1; }
    else if (l.id === 'building') { p['fill-color'] = '#011A24'; delete p['fill-outline-color']; }
    else if (l.type === 'fill') p['fill-color'] = ink;
    else if (/motorway/.test(l.id) && l.type === 'line') p['line-color'] = '#01394A';
    else if (/major/.test(l.id) && l.type === 'line') p['line-color'] = '#012F3D';
    else if (/rail/.test(l.id) && l.type === 'line') p['line-color'] = stone;
    else if (l.type === 'line') p['line-color'] = '#011F2A';
    else if (l.type === 'symbol') {
      p['text-color'] = /place_(city|town|suburb)/.test(l.id) ? parch : mist;
      p['text-halo-color'] = ink;
      p['text-halo-width'] = 1.2;
    }
  });
  return style;
}
function rasterFallback() {
  map.getContainer().classList.add('is-raster');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
}
(async function initBase() {
  try {
    if (!window.maplibregl || !L.maplibreGL) throw new Error('no maplibre');
    if (!document.createElement('canvas').getContext('webgl2')) throw new Error('no webgl');
    const r = await fetch('https://tiles.openfreemap.org/styles/dark');
    if (!r.ok) throw new Error('style ' + r.status);
    L.maplibreGL({ style: tuneStyle(await r.json()), attribution: ATTR }).addTo(map);
  } catch (e) { rasterFallback(); }
})();

// ── MARKERS ──────────────────────────────────────────────────────
const markerOf = new Map();
PLACES.forEach(place => {
  const icon = L.divIcon({ html:`<span class="pin">${svg(place.category)}</span>`, className:'pin-wrap', iconSize:[24,24], iconAnchor:[12,12] });
  const m = L.marker([place.lat, place.lon], { icon, alt:place.name, riseOnHover:true });
  m.bindTooltip(place.name, { className:'pin-tip', direction:'top', offset:[0,-12] });
  m.on('click', () => { lastTrigger = null; selectPlace(place); });
  markerOf.set(place, m);
});
function renderMarkers() {
  let count = 0;
  PLACES.forEach(p => {
    const show = !currentCategory || p.category === currentCategory;
    const m = markerOf.get(p);
    if (show) { if (!map.hasLayer(m)) m.addTo(map); count++; }
    else if (map.hasLayer(m)) map.removeLayer(m);
  });
  const nc = document.getElementById('n-count');
  nc.dataset.count = count;
  nc.textContent = places_n(count);
}
function markSel(place, on) {
  const el = markerOf.get(place)?.getElement();
  if (el) el.classList.toggle('is-sel', on);
  markerOf.get(place)?.setZIndexOffset(on ? 2000 : 0);
}

// ── LIST ─────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('list');
  const top = list.scrollTop;
  list.innerHTML = '';
  Object.keys(CAT).forEach(c => {
    if (currentCategory && c !== currentCategory) return;
    const places = PLACES.filter(p => p.category === c);
    if (!places.length) return;
    const g = document.createElement('section');
    g.className = 'l-group';
    g.innerHTML = `<h2>${svg(c)}<span></span><span></span></h2>`;
    g.querySelector('h2 span').textContent = label(c);
    g.querySelector('h2 span:last-child').textContent = places_n(places.length);
    places.forEach(place => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'list-item' + (selected === place ? ' sel' : '');
      item._place = place;
      item.innerHTML = `<span class="li-thumb">${svg(place.category)}<img alt="" loading="lazy"></span><span><span class="li-name"></span><span class="li-desc"></span></span>`;
      const img = item.querySelector('img');
      img.onerror = () => img.remove();
      if (PHOTO_URLS[place.name]) img.src = PHOTO_URLS[place.name]; else img.remove();
      item.querySelector('.li-name').textContent = place.name;
      item.querySelector('.li-desc').textContent = descOf(place);
      item.addEventListener('click', () => { lastTrigger = item; selectPlace(place); });
      const hot = on => { const m = markerOf.get(place), el = m.getElement(); if (el) el.classList.toggle('is-hot', on); if (selected !== place) m.setZIndexOffset(on ? 1500 : 0); };
      item.addEventListener('mouseenter', () => hot(true));
      item.addEventListener('mouseleave', () => hot(false));
      item.addEventListener('focus', () => hot(true));
      item.addEventListener('blur', () => hot(false));
      g.appendChild(item);
    });
    list.appendChild(g);
  });
  list.scrollTop = top;
}

// ── PANEL ────────────────────────────────────────────────────────
function fillPanel(place) {
  const badge = document.getElementById('p-badge');
  badge.innerHTML = svg(place.category) + '<span></span>';
  badge.querySelector('span').textContent = label(place.category);
  document.getElementById('p-name').textContent = place.name;
  document.getElementById('p-desc').textContent = descOf(place);
  document.getElementById('p-gmaps').href = `https://maps.google.com/?q=${place.lat},${place.lon}`;
  const info = document.getElementById('p-info');
  info.innerHTML = '';
  const hrs = HOURS[place.name];
  if (hrs) {
    info.innerHTML = `<div class="p-row">${svg('clock')}<span></span></div>`;
    info.querySelector('span').textContent = hrs;
  }
}
function selectPlace(place) {
  if (selected && selected !== place) markSel(selected, false);
  selected = place;
  markSel(place, true);
  fillPanel(place);
  const ph = document.getElementById('panel-photo');
  ph.innerHTML = svg(place.category);
  const url = getPhotoUrl(place);
  if (url) { const img = new Image(); img.alt = place.name; img.onerror = () => img.remove(); img.src = url; ph.appendChild(img); }
  document.getElementById('panel-scroll').scrollTop = 0;
  const panel = document.getElementById('panel');
  panel.classList.add('open');
  document.querySelectorAll('.list-item').forEach(i => {
    const on = i._place === place;
    i.classList.toggle('sel', on);
    if (on) i.scrollIntoView({ block:'nearest' });
  });
  const pt = map.project([place.lat, place.lon]);
  if (innerWidth > 900) pt.x += panel.offsetWidth / 2;
  map.panTo(map.unproject(pt), { animate:true, duration:.5 });
  if (lastTrigger) document.getElementById('panel-close').focus({ preventScroll:true });
}
function closePanel() {
  const panel = document.getElementById('panel');
  if (!panel.classList.contains('open')) return;
  panel.classList.remove('open');
  document.querySelectorAll('.list-item.sel').forEach(i => i.classList.remove('sel'));
  if (selected) { markSel(selected, false); selected = null; }
  if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus({ preventScroll:true });
  lastTrigger = null;
}
document.getElementById('panel-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
map.on('click', closePanel);

// ── FILTERS ──────────────────────────────────────────────────────
const filterBar = document.getElementById('filters');
const counts = {};
PLACES.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
function applyFilter(cat) {
  currentCategory = cat;
  filterBar.querySelectorAll('.chip').forEach(b => {
    const on = (b.dataset.cat || null) === cat;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  closePanel();
  renderMarkers();
  document.getElementById('list').scrollTop = 0;
  renderList();
}
const mkChip = (key, es, en, n) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  if (key !== 'all') b.dataset.cat = key;
  const hide = lang === 'es' ? ['', 'none'] : ['none', ''];
  b.innerHTML = `${svg(key)}<span class="l-es" style="display:${hide[0]}">${es}</span><span class="l-en" style="display:${hide[1]}">${en}</span>${n ? `<span class="cnt">${n}</span>` : ''}`;
  b.addEventListener('click', () => {
    if (key === 'all') return applyFilter(null);
    applyFilter(currentCategory === key ? null : key);   // segundo clic: vuelve a todos
  });
  filterBar.appendChild(b);
};
mkChip('all', 'Todos', 'All');
Object.entries(CAT).forEach(([name, c]) => { if (counts[name]) mkChip(name, c.label_es, c.label_en, counts[name]); });

// ── LANG ─────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.l-es').forEach(e => e.style.display = l === 'es' ? '' : 'none');
  document.querySelectorAll('.l-en').forEach(e => e.style.display = l === 'en' ? '' : 'none');
  [['btn-es','es'],['btn-en','en']].forEach(([id, v]) => {
    const b = document.getElementById(id);
    b.classList.toggle('active', l === v);
    b.setAttribute('aria-pressed', l === v);
  });
  const close = document.getElementById('panel-close');
  close.title = close.ariaLabel = l === 'es' ? 'Cerrar' : 'Close';
  filterBar.setAttribute('aria-label', l === 'es' ? 'Mis recomendaciones' : 'My recommendations');
  document.getElementById('n-count').textContent = places_n(parseInt(document.getElementById('n-count').dataset.count || '0'));
  renderList();
  if (selected) fillPanel(selected);
}

applyFilter(null);
setLang(localStorage.getItem('lang') === 'en' ? 'en' : 'es');
</script>
